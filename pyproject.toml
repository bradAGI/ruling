[project]
name = "ruling"
version = "0.2.0"
description = "Open-weight recreation of TypeSafe AI's Jev: typed, probabilistic decisions from a local model, no text generation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mlx-lm>=0.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "huggingface-hub>=0.25",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/bradAGI/ruling"
Source = "https://github.com/bradAGI/ruling"

[project.scripts]
ruling = "ruling.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "torch>=2.14.0",
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruling"]

[tool.hatch.build]
include = ["ruling/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# unit/ and integration/ hold same-named modules; importlib mode keeps them distinct.
addopts = "--import-mode=importlib"
markers = [
    "integration: loads a real model; slow on first run",
    "heavy: trains a model or spawns a server; skipped on CI runners without a GPU",
]
