<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ruling retraining</title>
<style>
  :root { --bg: #fafaf7; --fg: #1b1b1b; --muted: #6b6b6b; --line: #dcdcd5; --bar: #2f6f4f; --accent: #b3451f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece6; --muted: #9a9a92; --line: #33332f; --bar: #5fae85; --accent: #e0774d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 18px; }
  h1 small, .meta { color: var(--muted); font-weight: normal; font-size: 12px; }
  h1 small { margin-left: 8px; }
  a { color: inherit; }
  h2 { margin: 8px 0 4px; font-size: 15px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: normal; font-size: 12px; }
  td.num { text-align: right; white-space: nowrap; }
  .promoted { color: var(--bar); }
  .kept { color: var(--muted); }
  .serving { font-weight: bold; }
  .err { color: var(--accent); }
  svg.curve { display: block; color: var(--bar); }
  .kept svg.curve { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ruling <small>retraining history · <a href="/">playground</a></small></h1>
  <div id="out" class="meta">loading…</div>
</main>
<script>
const out = document.getElementById("out");
const pct = x => x == null ? "–" : x.toFixed(3);
function change(current, candidate, key) {
  return `${pct(current[key])} → ${pct(candidate[key])}`;
}
function text(value) {
  const span = document.createElement("span");
  span.textContent = value;
  return span.innerHTML;
}
const WIDTH = 120, HEIGHT = 28, PAD = 2;
function curve(training) {
  // Validation loss over steps, both axes scaled to the run; a flat run or a lone point sits on the middle line.
  const steps = training.map(e => e.step), losses = training.map(e => e.loss);
  const x0 = Math.min(...steps), x1 = Math.max(...steps), y0 = Math.min(...losses), y1 = Math.max(...losses);
  const x = s => x1 === x0 ? WIDTH / 2 : PAD + (s - x0) / (x1 - x0) * (WIDTH - 2 * PAD);
  const y = l => y1 === y0 ? HEIGHT / 2 : HEIGHT - PAD - (l - y0) / (y1 - y0) * (HEIGHT - 2 * PAD);
  const points = training.map(e => `${x(e.step).toFixed(1)},${y(e.loss).toFixed(1)}`).join(" ");
  const last = training[training.length - 1];
  return `<svg class="curve" viewBox="0 0 ${WIDTH} ${HEIGHT}" width="${WIDTH}" height="${HEIGHT}" role="img" ` +
         `aria-label="validation loss ${pct(training[0].loss)} to ${pct(last.loss)} over ${last.step} steps">` +
         `<polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}
function finalLoss(training) {
  const last = training[training.length - 1];
  return `${pct(last.train_loss)} / ${pct(last.loss)}`;
}
let key = "";
try { key = sessionStorage.getItem("ruling-key") || ""; } catch {}
fetch("/v1/retrain", { headers: key ? { authorization: `Bearer ${key}` } : {} }).then(async r => {
  const data = await r.json();
  if (r.status === 401) throw new Error("this server needs its API key; enter it in the playground first");
  if (!r.ok) throw new Error(`${r.status} ${data.error.code}: ${data.error.message}`);
  return data;
}).then(data => {
  if (!data.models.length) {
    out.innerHTML = "No served model is a <code>ruling retrain</code> adapter. Serve one with " +
      "<code>RULING_ADAPTER=&lt;adapters&gt;/current</code>.";
    return;
  }
  let html = "";
  for (const m of data.models) {
    const preview = m.preview && m.preview !== m.current ? `, preview ${text(m.preview)} as ${text(m.name)}:preview` : "";
    html += `<h2>${text(m.name)} <span class="meta">serving ${text(m.current ?? "the base model")}${preview}</span></h2>`;
    if (!m.versions.length) { html += '<div class="meta">no finished runs yet</div>'; continue; }
    html += '<div class="scroll"><table><thead><tr><th>version</th><th>from</th><th class="num">records</th>' +
            '<th class="num">held-out accuracy</th><th class="num">held-out log loss</th>' +
            '<th>validation loss</th><th class="num">final loss train / valid</th><th>verdict</th></tr></thead><tbody>';
    for (const v of [...m.versions].reverse()) {
      const serving = v.version === m.current ? " serving" : "";
      html += `<tr class="${v.promoted ? "promoted" : "kept"}${serving}" data-version="${text(v.version)}">` +
              `<td>${text(v.version)}</td><td>${text(v.started_from ?? "base")}</td>` +
              `<td class="num">${v.records}</td><td class="num">${change(v.current, v.candidate, "accuracy")}</td>` +
              `<td class="num">${change(v.current, v.candidate, "nll")}</td>` +
              `<td>${v.training?.length ? curve(v.training) : "–"}</td>` +
              `<td class="num">${v.training?.length ? finalLoss(v.training) : "–"}</td>` +
              `<td>${v.promoted ? "promoted" : "kept"}: ${text(v.reason)}</td></tr>`;
    }
    html += "</tbody></table></div>";
  }
  out.className = "";
  out.innerHTML = html;
}).catch(e => { out.className = "err"; out.textContent = `could not load the history: ${e.message}`; });
</script>
</body>
</html>
