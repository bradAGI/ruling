<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ruling playground</title>
<style>
  :root { --bg: #fafaf7; --fg: #1b1b1b; --muted: #6b6b6b; --line: #dcdcd5; --bar: #2f6f4f; --accent: #b3451f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece6; --muted: #9a9a92; --line: #33332f; --bar: #5fae85; --accent: #e0774d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 18px; }
  h1 small { color: var(--muted); font-weight: normal; margin-left: 8px; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 260px; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font: inherit; }
  button { grid-column: 1 / -1; justify-self: start; padding: 8px 14px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 4px; font: inherit; cursor: pointer; }
  #out { grid-column: 1 / -1; display: grid; gap: 12px; }
  .q { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
  .q b { display: block; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 140px 1fr 60px; gap: 8px; align-items: center; font-size: 13px; }
  .bar { height: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--bar); }
  .meta { color: var(--muted); font-size: 12px; }
  .err { color: var(--accent); }
  a { color: inherit; }
  #thumbs, .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumb { position: relative; width: 220px; max-width: 100%; font-size: 12px; color: var(--muted); }
  /* The whole image, scaled to fit, so a receipt's text or a photo's edge stays readable before deciding. */
  .thumb img { display: block; width: 100%; height: 220px; object-fit: contain; background: var(--line); border: 1px solid var(--line); border-radius: 4px; }
  .thumb button { position: absolute; top: 2px; right: 2px; padding: 0 5px; font-size: 12px; line-height: 16px; }
  input[type=file] { font: inherit; font-size: 12px; margin-top: 8px; max-width: 100%; }
  #key, select { width: 100%; box-sizing: border-box; margin-bottom: 8px; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
  button.small { grid-column: auto; padding: 2px 8px; font-size: 12px; background: transparent; color: inherit; border-color: var(--line); }
  nav { grid-column: 1 / -1; display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  nav button { grid-column: auto; background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; padding: 6px 14px; }
  nav button.on { color: var(--fg); border-color: var(--line); background: var(--bg); margin-bottom: -1px; }
  section { grid-column: 1 / -1; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  section[hidden] { display: none; }
  #question { min-height: 80px; }
  #ask-out { grid-column: 1 / -1; display: grid; gap: 12px; }
  .said { font-size: 22px; margin: 2px 0 4px; }
  .work { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { white-space: pre-wrap; font: inherit; font-size: 12px; margin: 6px 0; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } section { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>ruling <small>typed decisions, no text generation · <a href="/history">retraining history</a></small></h1>
  <div>
    <label for="model">model</label>
    <select id="model"></select>
  </div>
  <div>
    <label for="key">API key, only for a server started with RULING_API_KEY</label>
    <input id="key" type="password" autocomplete="off">
  </div>
  <nav>
    <button type="button" id="tab-decide" class="on">decide</button>
    <button type="button" id="tab-ask">ask</button>
  </nav>
  <section id="decide">
  <div>
    <label for="state">state (text or JSON)</label>
    <textarea id="state">{"message": "My card was charged twice for one order. Refund the duplicate."}</textarea>
    <label for="images">images, added to the state as <code>images</code>; ask about them as &lt;image 1&gt;, &lt;image 2&gt;, …</label>
    <input type="file" id="images" accept="image/png,image/jpeg,image/webp" multiple>
    <button type="button" id="image-example" class="small">image example</button>
    <div id="images-note" class="meta"></div>
    <div id="thumbs"></div>
  </div>
  <div>
    <label for="questions">questions (JSON)</label>
    <textarea id="questions">{
  "team": {"type": "choice", "instructions": "Which team should handle this?",
           "criteria": {"billing": "Charges and refunds", "technical": "Bugs", "sales": "Pricing"}},
  "urgency": {"type": "score", "instructions": "How urgent is this?",
              "criteria": ["Can wait", "This week", "Today"]},
  "refund": {"type": "noul", "instructions": "The customer asks for a refund."}
}</textarea>
  </div>
  <button id="run">Decide</button>
  <div id="out"></div>
  </section>
  <section id="ask" hidden>
  <div style="grid-column: 1 / -1">
    <label for="question">a question in plain words; the model reads it as typed questions and answers those</label>
    <textarea id="question">is a hot dog a sandwich?</textarea>
    <label for="ask-images">pictures the question is about, named &lt;image 1&gt;, &lt;image 2&gt;, … in order</label>
    <input type="file" id="ask-images" accept="image/png,image/jpeg,image/webp" multiple>
    <div id="ask-images-note" class="meta"></div>
    <div id="ask-thumbs" class="thumbs"></div>
  </div>
  <button id="ask-run">Ask</button>
  <div id="ask-out"></div>
  </section>
</main>
<script>
const out = document.getElementById("out");
const model = document.getElementById("model");
const picker = document.getElementById("images");
const askPicker = document.getElementById("ask-images");
const thumbs = document.getElementById("thumbs");
const stateBox = document.getElementById("state");
const modalities = {};
let picked = [];
const keyBox = document.getElementById("key");
// Kept for this tab only, and shared with the history page, which reads it from the same place.
try { keyBox.value = sessionStorage.getItem("ruling-key") || ""; } catch {}
function auth() {
  const key = keyBox.value.trim();
  return key ? { authorization: `Bearer ${key}` } : {};
}
keyBox.onchange = () => {
  try { sessionStorage.setItem("ruling-key", keyBox.value.trim()); } catch {}
  listModels();
};
function listModels() {
  return fetch("/v1/models", { headers: auth() }).then(async r => {
    const data = await r.json();
    if (r.status === 401) throw new Error("this server needs its API key; enter it above");
    if (!r.ok) throw new Error(`${r.status} ${data.error.code}: ${data.error.message}`);
    return data;
  }).then(showModels).catch(e => { out.innerHTML = `<div class="err">could not list models: ${e.message}</div>`; });
}
function showModels(data) {
  const first = !model.options.length;
  model.innerHTML = "";
  out.innerHTML = "";
  for (const m of data.models) {
    modalities[m.name] = m.modalities;
    const option = document.createElement("option");
    option.value = m.name;
    option.textContent = m.adapter ? `${m.name} (${m.base} + adapter ${m.adapter})` : m.name === m.base ? m.name : `${m.name} (${m.base})`;
    model.appendChild(option);
  }
  showModalities();
  // A server whose default model reads images opens on an example that uses one.
  if (first && (modalities[model.value] || []).includes("image")) loadImageExample();
}
listModels();
function parseState(text) { try { return JSON.parse(text); } catch { return text; } }
function countImages(value) {
  if (Array.isArray(value)) return value.reduce((n, v) => n + countImages(v), 0);
  if (value && typeof value === "object") {
    return value.type === "image" ? 1 : Object.values(value).reduce((n, v) => n + countImages(v), 0);
  }
  return 0;
}
// Picked images go after everything already in the state, so they take the next numbers.
function withImages(state) {
  if (!picked.length) return state;
  const images = picked.map(({ media_type, data }) => ({ type: "image", media_type, data }));
  return state && typeof state === "object" && !Array.isArray(state) ? { ...state, images } : { text: state, images };
}
function showThumbs() {
  drawThumbs(thumbs, picked, countImages(parseState(stateBox.value)) + 1, i => { picked.splice(i, 1); showThumbs(); });
}
function showModalities() {
  const sees = (modalities[model.value] || []).includes("image");
  const note = sees ? "" : "this model reads text only; serve a vision: model to ask about images";
  picker.disabled = !sees;
  document.getElementById("image-example").disabled = !sees;
  document.getElementById("images-note").textContent = note;
  askPicker.disabled = !sees;
  document.getElementById("ask-images-note").textContent = note;
}
function readFiles(input) {
  const read = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ media_type: file.type, data: reader.result.split(",", 2)[1] });
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
  return Promise.all([...input.files].map(read));
}
function drawThumbs(box, images, first, remove) {
  box.innerHTML = "";
  images.forEach((image, i) => {
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.innerHTML = `<img alt=""><span>&lt;image ${first + i}&gt;</span><button type="button" aria-label="remove">×</button>`;
    thumb.querySelector("img").src = `data:${image.media_type};base64,${image.data}`;
    thumb.querySelector("button").onclick = () => remove(i);
    box.appendChild(thumb);
  });
}
// An example to try with a model that reads images: a receipt drawn here, so the page ships no image file.
const IMAGE_STATE = {"note": "The customer says order 4471 was charged twice and attached the receipt."};
const IMAGE_QUESTIONS = {
  "kind": {"type": "choice", "instructions": "What is <image 1>?",
           "criteria": {"receipt": "A store or restaurant receipt", "photo": "A photo of a person or a place",
                        "screenshot": "A screenshot of an app"}},
  "same_order": {"type": "noul", "instructions": "The order number on <image 1> is the one in the note."},
  "total": {"type": "score", "instructions": "How large is the total on <image 1>?",
            "criteria": ["Under $10", "$10 to $100", "Over $100"]}
};
function drawReceipt() {
  const canvas = document.createElement("canvas");
  canvas.width = 360; canvas.height = 480;
  const g = canvas.getContext("2d");
  g.fillStyle = "#fffdf6"; g.fillRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = "#222"; g.textBaseline = "top";
  const lines = [["bold 26px sans-serif", "CORNER CAFE"], ["16px monospace", "12 Market St, Springfield"], ["16px monospace", ""],
                 ["18px monospace", "Order #4471"], ["16px monospace", ""], ["18px monospace", "2 x Latte          9.00"],
                 ["18px monospace", "1 x Bagel          4.50"], ["18px monospace", "1 x Fruit bowl     6.25"],
                 ["18px monospace", "Tip                2.35"], ["16px monospace", ""], ["bold 22px monospace", "TOTAL  $22.10"],
                 ["16px monospace", ""], ["18px monospace", "PAID  VISA ****1881"], ["16px monospace", "Thank you!"]];
  let y = 24;
  for (const [font, text] of lines) { g.font = font; g.fillText(text, 28, y); y += 30; }
  return { media_type: "image/png", data: canvas.toDataURL("image/png").split(",", 2)[1] };
}
function loadImageExample() {
  stateBox.value = JSON.stringify(IMAGE_STATE, null, 2);
  document.getElementById("questions").value = JSON.stringify(IMAGE_QUESTIONS, null, 2);
  picked = [drawReceipt()];
  showThumbs();
}
document.getElementById("image-example").onclick = loadImageExample;
model.onchange = showModalities;
stateBox.oninput = showThumbs;
picker.onchange = async () => {
  picked = picked.concat(await readFiles(picker));
  picker.value = "";
  showThumbs();
};
function bar(label, p) {
  return `<div class="row"><span>${label}</span><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div><span>${p.toFixed(3)}</span></div>`;
}
document.getElementById("run").onclick = async () => {
  out.innerHTML = '<div class="meta">deciding…</div>';
  let questions;
  try { questions = JSON.parse(document.getElementById("questions").value); }
  catch (e) { out.innerHTML = `<div class="err">questions is not valid JSON: ${e.message}</div>`; return; }
  const body = { model: model.value, state: withImages(parseState(stateBox.value)), questions };
  const started = performance.now();
  const res = await fetch("/v1/systemone", { method: "POST", headers: { "content-type": "application/json", ...auth() },
                                             body: JSON.stringify(body) });
  const ms = Math.round(performance.now() - started);
  const data = await res.json();
  if (!res.ok) { out.innerHTML = `<div class="err">${res.status} ${data.error.code}: ${data.error.message}</div>`; return; }
  let html = `<div class="meta">${data.model} · ${data.usage.input_tokens} input tokens · ${ms} ms</div>`;
  for (const [id, a] of Object.entries(data.answers)) {
    html += `<div class="q"><b>${id} <span class="meta">${a.type}</span></b>`;
    if (a.type === "noul") html += bar("yes", a.noul) + bar("no", 1 - a.noul);
    else {
      for (const [k, p] of Object.entries(a.probabilities)) html += bar(a.type === "score" ? a.legend[k] : k, p);
      html += `<div class="meta">${a.type === "choice" ? "choice: " + a.choice : "score: " + a.score.toFixed(2)} · confidence ${a.confidence.toFixed(2)}</div>`;
    }
    html += "</div>";
  }
  out.innerHTML = html;
};
// The ask tab: one question in words, the typed questions it became, and every answer with its check.
const askOut = document.getElementById("ask-out");
let askPicked = [];
function showAskThumbs() {
  drawThumbs(document.getElementById("ask-thumbs"), askPicked, 1, i => { askPicked.splice(i, 1); showAskThumbs(); });
}
askPicker.onchange = async () => {
  askPicked = askPicked.concat(await readFiles(askPicker));
  askPicker.value = "";
  showAskThumbs();
};
const tabs = { decide: document.getElementById("decide"), ask: document.getElementById("ask") };
function showTab(name) {
  for (const [tab, section] of Object.entries(tabs)) {
    section.hidden = tab !== name;
    document.getElementById(`tab-${tab}`).classList.toggle("on", tab === name);
  }
}
document.getElementById("tab-decide").onclick = () => showTab("decide");
document.getElementById("tab-ask").onclick = () => showTab("ask");
const KIND_WORDS = { yes_or_no: "a yes or no", pick_one: "a pick", how_much: "a how much", how_likely: "a how likely" };
function answerBars(a) {
  if (a.type === "noul") return bar("yes", a.noul) + bar("no", 1 - a.noul);
  let html = "";
  for (const [k, p] of Object.entries(a.probabilities)) html += bar(a.type === "score" ? a.legend[k] : k, p);
  return html;
}
function askHtml(data, ms) {
  let html = `<div class="meta">${data.model} · ${data.usage.input_tokens} input tokens · ${ms} ms`;
  if (data.readings.length) html += ` · read as ${data.readings.map(k => KIND_WORDS[k]).join(" and ")}`;
  if (data.unfinished) html += " · reads as unfinished";
  if (data.fit < 0.5) html += " · not fit for a public page";
  html += "</div>";
  if (data.refused) html += `<div class="q"><div class="said">No. That's not a question I can answer.</div><div class="meta">the model judged the input is not a question its types answer</div></div>`;
  for (const s of data.answers) {
    const who = s.source === "fact" ? "answered in the first request" : "options written by the model, then judged";
    const check = s.checked == null ? "" : s.checked >= 0.5 ? ` · checked: stands by it (${s.checked.toFixed(2)})` : ` · <span class="err">checked: doubts this answer (${s.checked.toFixed(2)})</span>`;
    html += `<div class="q"><div class="said">${s.said}</div><div class="meta">${KIND_WORDS[s.kind]} · ${who}${check}</div>`;
    html += `<div class="work"><div class="meta">${s.question.instructions}</div>${answerBars(s.answer)}</div></div>`;
  }
  for (const d of data.dropped) html += `<div class="meta err">${d}</div>`;
  html += `<details><summary>how it got there: the nine questions, and what the writer wrote</summary>`;
  for (const [id, a] of Object.entries(data.facts)) {
    html += `<div class="q"><b>${id} <span class="meta">${a.type}</span></b>${answerBars(a)}</div>`;
  }
  if (data.wrote != null) html += `<div class="q"><b>the writer's reply</b><pre></pre></div>`;
  html += `</details><button type="button" id="open-decide" class="small">open in decide</button>`;
  return html;
}
document.getElementById("ask-run").onclick = async () => {
  askOut.innerHTML = '<div class="meta">asking…</div>';
  const body = { model: model.value, input: document.getElementById("question").value };
  if (askPicked.length) body.images = askPicked.map(({ media_type, data }) => ({ type: "image", media_type, data }));
  const started = performance.now();
  const res = await fetch("/v1/ask", { method: "POST", headers: { "content-type": "application/json", ...auth() },
                                       body: JSON.stringify(body) });
  const ms = Math.round(performance.now() - started);
  const data = await res.json();
  if (!res.ok) { askOut.innerHTML = `<div class="err">${res.status} ${data.error.code}: ${data.error.message}</div>`; return; }
  askOut.innerHTML = askHtml(data, ms);
  if (data.wrote != null) askOut.querySelector("pre").textContent = data.wrote;
  // The typed questions behind the answers, in the decide tab, to read or change.
  document.getElementById("open-decide").onclick = () => {
    const questions = {};
    data.answers.forEach((s, i) => { questions[s.source === "fact" ? s.kind : `q${i + 1}`] = s.question; });
    stateBox.value = JSON.stringify({ input: data.input }, null, 2);
    if (!Object.keys(questions).length) questions.yes = { type: "noul", instructions: "Answer the question in the input." };
    document.getElementById("questions").value = JSON.stringify(questions, null, 2);
    picked = askPicked.slice();
    showThumbs();
    showTab("decide");
  };
};
</script>
</body>
</html>
